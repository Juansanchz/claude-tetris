name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_non_write_users: "*"
          claude_args: |
            --allowedTools "Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue view:*)"
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.

            1. Lee el título y la descripción del issue (`gh issue view ${{ github.event.issue.number }}`).
            2. Revisa el código del repositorio (game.js, index.html, style.css y CLAUDE.md) para entender el contexto del problema.
            3. Ejecuta `gh label list` y asigna las labels que correspondan de las ya existentes en el repo
               (bug, enhancement, documentation, question, good first issue, help wanted, invalid, duplicate, wontfix)
               con `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`.
               No crees labels nuevas.
            4. Publica un comentario en el issue con
               `gh issue comment ${{ github.event.issue.number }} --body "..."`
               con un diagnóstico general en español que incluya:
               - Resumen del problema.
               - Archivos y funciones probablemente implicadas (ej. `game.js` función `rotateCW`), citando
                 la tabla de "Key Functions" de CLAUDE.md cuando aplique.
               - Hipótesis de causa raíz si es identificable a partir del código.
               - Próximos pasos sugeridos para implementar la solución (sin escribir el código todavía).

            Si el issue no tiene suficiente información para diagnosticar, dilo en el comentario y pide los
            detalles que faltan en lugar de inventar una causa.
